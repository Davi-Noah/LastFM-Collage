<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cartify - Print Your Stats</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist:wght@400;600&family=JetBrains+Mono:wght@400;700&family=Montserrat:wght@600;700;800&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="/styles/style.css" />
    <link rel="icon" type="image/png" href="imgs/screen-removebg-preview.png" />
  </head>
  <body>
    <header class="header">
      <div class="container header-container">
        <a href="/"><h1 class="logo">Cartify</h1></a>
        <button class="btn btn-primary">Build your collage.</button>
      </div>
    </header>

    <main class="config-section">
      <div class="container config-container">
        <header class="config-header">
          <h2>Print Your Stats</h2>
          <p>
            Customize the parameters below to generate your personalized music
            consumption receipt.
          </p>
        </header>

        <form action="/inicial" method="get">
          <div class="config-group">
            <div class="config-label">
              <svg
                width="16"
                height="16"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                <circle cx="12" cy="7" r="4"></circle>
              </svg>
              USER LAST.FM
            </div>

            <input
              type="text"
              name="user"
              class="input-text"
              placeholder="Digite o username..."
              required
            />
          </div>

          <hr class="divider" />
          <div class="config-card">
            <div class="config-group">
              <div class="config-label">
                <svg
                  width="16"
                  height="16"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                >
                  <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
                  <line x1="16" y1="2" x2="16" y2="6"></line>
                  <line x1="8" y1="2" x2="8" y2="6"></line>
                  <line x1="3" y1="10" x2="21" y2="10"></line>
                </svg>
                PERIOD
              </div>

              <input
                type="hidden"
                name="periodo"
                id="input-periodo"
                value="6_meses"
              />

              <div class="toggle-buttons" id="group-periodo">
                <button type="button" class="btn btn-toggle" data-value="1_mes">
                  1 Month
                </button>
                <button
                  type="button"
                  class="btn btn-toggle active"
                  data-value="6_meses"
                >
                  6 Months
                </button>
                <button
                  type="button"
                  class="btn btn-toggle"
                  data-value="todo_tempo"
                >
                  All Time
                </button>
              </div>
            </div>

            <hr class="divider" />

            <div class="config-group">
              <div class="config-label">
                <svg
                  width="16"
                  height="16"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                >
                  <polygon points="12 2 2 7 12 12 22 7 12 2"></polygon>
                  <polyline points="2 17 12 22 22 17"></polyline>
                  <polyline points="2 12 12 17 22 12"></polyline>
                </svg>
                DATA TYPE
              </div>

              <input type="hidden" name="tipo" id="input-tipo" value="albuns" />

              <div class="toggle-buttons" id="group-tipo">
                <button
                  type="button"
                  class="btn btn-toggle"
                  data-value="musicas"
                >
                  Musics
                </button>
                <button
                  type="button"
                  class="btn btn-toggle"
                  data-value="artistas"
                >
                  Artists
                </button>
                <button
                  type="button"
                  class="btn btn-toggle active"
                  data-value="albuns"
                >
                  Albums
                </button>
              </div>
            </div>

            <div class="config-action">
              <button class="btn btn-primary btn-generate" type="submit">
                <svg
                  width="18"
                  height="18"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                >
                  <path
                    d="M4 2v20l2-1 2 1 2-1 2 1 2-1 2 1 2-1 2 1V2l-2 1-2-1-2 1-2-1-2 1-2-1-2 1Z"
                  ></path>
                  <line x1="16" y1="8" x2="8" y2="8"></line>
                  <line x1="16" y1="12" x2="8" y2="12"></line>
                  <line x1="10" y1="16" x2="8" y2="16"></line>
                </svg>
                Generate Cart
              </button>
            </div>
          </div>
        </form>
      </div>
    </main>

    <footer class="footer">
      <div class="container footer-container">
        <div class="footer-copy">&copy; 2026 Cartfy. Powered by davinoah.</div>
        <nav class="footer-links">
          <a href="#">Privacy Policy</a>
          <a href="#">Terms of Service</a>
          <a href="#">Github</a>
        </nav>
      </div>
    </footer>

    <script>
      document.addEventListener("DOMContentLoaded", () => {
        function setupToggleGroup(groupId, inputId) {
          const container = document.getElementById(groupId);
          const buttons = container.querySelectorAll(".btn-toggle");
          const hiddenInput = document.getElementById(inputId);

          buttons.forEach((button) => {
            button.addEventListener("click", () => {
              buttons.forEach((btn) => btn.classList.remove("active"));
              button.classList.add("active");
              hiddenInput.value = button.getAttribute("data-value");
            });
          });
        }

        setupToggleGroup("group-periodo", "input-periodo");
        setupToggleGroup("group-tipo", "input-tipo");
      });
    </script>
  </body>
</html>
