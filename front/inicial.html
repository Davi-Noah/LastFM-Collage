<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cartfy</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist:wght@400;600&family=JetBrains+Mono:wght@400;700&family=Montserrat:wght@600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/styles/style.css" />
    <link rel="icon" type="image/png" href="imgs/screen-removebg-preview.png" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  </head>
  <body>
    <header class="header">
      <div class="container">
        <a href="/"><h1 class="logo">Cartify</h1></a>
        <a href="/consulta"><button class="btn btn-primary">Build your collage.</button></a>
      </div>
    </header>

    <main class="cart-section">
      <div class="container cart-container">
        <div class="cart-card items-column">
          <h2>Your Cart</h2>

          <div id="cart-items-list">
            <p
              style="
                text-align: center;
                color: var(--text-secondary);
                margin-top: 20px;
              "
            >
              Carregando seu carrinho...
            </p>
          </div>
        </div>

        <div class="cart-card summary-column">
          <h2>Order Summary</h2>

          <div class="summary-row">
            <span class="summary-label">Subtotal (Tracks)</span>
            <span class="summary-value" id="summary-items">00 Items</span>
          </div>

          <div class="summary-row">
            <span class="summary-label">Processing Fee</span>
            <span class="summary-value text-green">FREE</span>
          </div>

          <hr class="summary-divider" />

          <div class="summary-total">
            <span class="summary-label">TOTAL TIME</span>
            <span class="total-time-value" id="summary-time">--:--</span>
          </div>

          <button id="btn-download" class="btn btn-primary btn-block">
            <svg
              width="18"
              height="18"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              style="margin-right: 8px; vertical-align: middle"
            >
              <circle cx="9" cy="21" r="1"></circle>
              <circle cx="20" cy="21" r="1"></circle>
              <path
                d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"
              ></path>
            </svg>
            PLACE ORDER
          </button>
        </div>
      </div>
    </main>

    <footer class="footer">
      <div class="container">
        <div class="footer-copy">&copy; 2026 Cartfy. Powered by davinoah.</div>
        <nav class="footer-links">
          <a href="#">Privacy Policy</a>
          <a href="#">Terms of Service</a>
          <a href="#">Github</a>
        </nav>
      </div>
    </footer>
    <script>
      document.addEventListener("DOMContentLoaded", () => {
        const params = window.location.search;
        const itemsContainer = document.getElementById("cart-items-list");
        const summaryItems = document.getElementById("summary-items");
        const summaryTime = document.getElementById("summary-time");

        fetch(`/api/gerar${params}`)
          .then((res) => res.json())
          .then((dados) => {
            itemsContainer.innerHTML = "";

            if (dados.erro) {
              itemsContainer.innerHTML = `<p style="text-align:center; color: red;">Erro: ${dados.erro}</p>`;
              return;
            }

            // Atualiza a quantidade exata de itens
            const qtd = dados.length;
            summaryItems.innerText = `${qtd < 10 ? "0" + qtd : qtd} Items`;

            let totalPlays = 0;
            let totalSegundosListados = 0;

            dados.forEach((item) => {
              // 1. Tratamento da Duração (Converte segundos pra Min:Seg) - SEU CÓDIGO INTACTO
              const duracaoSegundos = parseInt(item.duration) || 0;
              const playCount = parseInt(item.playcount) || 0; // Garantindo que é número

              // A mágica acontece aqui: multiplicamos pela quantidade de plays
              const duracaoTotalItem = duracaoSegundos * playCount;

              let tempoFormatado = "--:--";

              if (duracaoSegundos > 0) {
                const min = Math.floor(duracaoSegundos / 60);
                const seg = (duracaoSegundos % 60).toString().padStart(2, "0");
                tempoFormatado = `${min}:${seg}`;

                // Soma o tempo acumulado de todas as execuções
                totalSegundosListados += duracaoTotalItem;
              }

              const playcount = parseInt(item.playcount) || 0;
              totalPlays += playcount;
              // 2. Cria a div da música
              const div = document.createElement("div");
              div.className = "cart-item";
              const artistaText = item.artist ? item.artist : "Last.fm";

              // Lógica para mostrar a imagem, IGNORANDO a estrelinha do Last.fm
              const isStarPlaceholder =
                item.image &&
                item.image.includes("2a96cbd8b46e442fc41c2b86b821562f");

              const imageHTML =
                item.image && !isStarPlaceholder
                  ? `<img src="${item.image}" alt="${item.name}" style="width: 100%; height: 100%; object-fit: cover; border-radius: 4px;">`
                  : `<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.3"><circle cx="12" cy="12" r="10"></circle><circle cx="12" cy="12" r="3"></circle></svg>`;

              // AQUI: Juntei o item-left (com a imagem) e o seu item-right (com plays e duração)
              div.innerHTML = `
          <div class="item-left">
            <div class="item-image-placeholder">
              ${imageHTML}
            </div>
            <div class="item-details">
              <span class="item-name">${item.name}</span>
              <span class="item-artist">${artistaText}</span>
            </div>
          </div>

          <div class="item-right">
            <div class="item-plays">
              <span class="plays-label">PLAYS</span>
              <span class="plays-value">x${item.playcount}</span>
            </div>
            <div class="item-duration">
              <span class="duration-label">DURATION</span>
              <span class="duration-value">${tempoFormatado}</span>
            </div>
          </div>
        `;
              itemsContainer.appendChild(div);
            });

            // 3. Atualiza o Tempo Total (TOTAL TIME)
            if (totalSegundosListados > 0) {
              const totalMin = Math.floor(totalSegundosListados / 60);
              const totalSeg = (totalSegundosListados % 60)
                .toString()
                .padStart(2, "0");
              // Formata pra "12:54" ou "05:30"
              summaryTime.innerText = `${totalMin < 10 ? "0" + totalMin : totalMin}:${totalSeg}`;
            } else {
              // Se for álbum ou artista, a API não dá tempo, então fica --:--
              summaryTime.innerText = "--:--";
            }
          })
          .catch((err) => {
            console.error(err);
            itemsContainer.innerHTML =
              '<p style="text-align:center;">Falha na conexão com o servidor.</p>';
          });
      });

      document.getElementById("btn-download").addEventListener("click", () => {
        // Seleciona o elemento que você quer transformar em imagem
        const element = document.querySelector(".cart-container");

        html2canvas(element, {
          backgroundColor: "#120d0a", // Cor de fundo do print
          logging: false,
          width: element.offsetWidth, // Aumenta a largura para melhorar a qualidade
          scale: 4, // Aumenta a qualidade/resolução da imagem
          useCORS: true, // Permite carregar imagens de outras origens (como capas de álbuns)
          allowTaint: true, // Permite usar imagens que não permitem CORS (como as do Last.fm)
        }).then((canvas) => {
          // Cria um link temporário para forçar o download
          const link = document.createElement("a");
          link.download = "meu-recibo-cartify.png";
          link.href = canvas.toDataURL("image/png");
          link.click();
        });
      });
    </script>
  </body>
</html>
